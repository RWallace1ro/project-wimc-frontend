workflows:
  android-capacitor:
    name: WIMC Android (Capacitor)
    max_build_duration: 60
    environment:
      java: 21
      android_signing:
        # Uploaded in Codemagic's Team settings > Code signing identities >
        # Android under the reference name "WIMC".
        - WIMC
      vars:
        PACKAGE_NAME: "com.gingerfaith.wimc"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: stage-react-api
          include: true
    scripts:
      - name: Build web assets
        script: |
          cd wimc-react-app
          npm ci
          CI=false npm run build
      - name: Sync Capacitor Android project
        script: |
          cd wimc-react-app
          npx cap sync android
      - name: Build .aab
        script: |
          cd wimc-react-app/android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - wimc-react-app/android/app/build/outputs/**/*.aab
      - wimc-react-app/android/app/build/outputs/**/*.apk
    publishing:
      # Uncomment once you're ready to auto-upload builds to Google Play —
      # requires the Google Play integration to already be connected in
      # Codemagic's team settings.
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      email:
        recipients:
          - rwallaceroc@gmail.com
        notify:
          success: true
          failure: true

  ios-capacitor:
    name: WIMC iOS (Capacitor)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "wimc-react-app/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.gingerfaith.wimc"
      # Set this up in Codemagic's Team settings > Integrations > App Store
      # Connect once the Apple Developer account is active, then reference
      # its name here (Codemagic calls it "App Store Connect" by default).
      # ios_signing below reads from that integration automatically.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gingerfaith.wimc
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: stage-react-api
          include: true
    scripts:
      - name: Build web assets
        script: |
          cd wimc-react-app
          npm ci
          CI=false npm run build
      - name: Sync Capacitor iOS project
        script: |
          cd wimc-react-app
          npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd wimc-react-app/ios/App
          pod install
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # Auto-uploads every build straight to TestFlight — necessary since
      # manually uploading an .ipa normally requires Apple's Transporter app,
      # which is Mac-only. Uses the same Developer Portal API key integration
      # already connected in Codemagic's team settings.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - rwallaceroc@gmail.com
        notify:
          success: true
          failure: true
