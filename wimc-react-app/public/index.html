<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Content Security Policy
         Tells browsers which sources are trusted for scripts, styles, images,
         API connections, media, and fonts. Blocks injection attacks.
         'unsafe-inline' is required for styles because React uses inline style props.
         Scripts are restricted to self + the Cloudinary upload widget only.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://upload-widget.cloudinary.com https://www.googletagmanager.com https://apis.google.com 'sha256-gEJJ3znKpnHML/iTUXZM0ij/4govdgqYo3+a6Nx0+l4=';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob:
        https://res.cloudinary.com
        https://images.unsplash.com
        https://*.googleusercontent.com;
      connect-src 'self'
        https://*.googleapis.com
        https://apis.google.com
        https://*.firebaseapp.com
        https://*.cloudfunctions.net
        https://api.cloudinary.com
        https://res.cloudinary.com
        https://upload-widget.cloudinary.com
        https://api.anthropic.com
        https://api.open-meteo.com
        https://nominatim.openstreetmap.org
        https://*.sentry.io
        https://api.stripe.com
        https://*.stripe.com
        https://www.googletagmanager.com
        https://www.google-analytics.com
        https://*.google-analytics.com
        https://*.analytics.google.com;
      media-src 'self' blob: https://res.cloudinary.com;
      worker-src 'self' blob:;
      font-src 'self';
      frame-src 'self'
        https://www.youtube.com
        https://player.vimeo.com
        https://upload-widget.cloudinary.com
        https://widget.cloudinary.com
        https://*.cloudinary.com
        https://accounts.google.com
        https://*.firebaseapp.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests;
    " />

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1F3864" />
    <!-- Android / Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WIMC" />

    <!-- Primary meta -->
    <meta name="description" content="What's in My Closet — organize your wardrobe, build outfits, and get AI styling advice." />
    <meta name="keywords" content="wardrobe organizer, closet app, outfit builder, AI stylist, fashion" />
    <meta name="author" content="What's in My Closet" />

    <!-- Open Graph (social sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="What's in My Closet" />
    <meta property="og:description" content="Organize your wardrobe, build outfits, and get AI styling advice — all in one place." />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />
    <meta property="og:url" content="https://rwallace1ro.github.io/project-wimc-frontend/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="What's in My Closet" />
    <meta name="twitter:description" content="Organize your wardrobe, build outfits, and get AI styling advice." />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo512.png" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Cloudinary upload widget -->
    <script
      src="https://upload-widget.cloudinary.com/latest/global/all.js"
      type="text/javascript"
    ></script>

    <title>What's in My Closet</title>

    <!-- GitHub Pages SPA redirect receiver.
         Pairs with public/404.html. When GH Pages 404s on a deep link,
         404.html saves the URL to sessionStorage and bounces to the app root.
         This script restores the original URL so React Router renders correctly. -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
